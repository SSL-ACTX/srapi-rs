[package]
name = "srapi-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "srapi_rs"
crate-type = ["rlib", "cdylib"]

[features]
ffi = []

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "stream", "multipart", "cookies", "json"] }
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "fs",
    "io-util"
]}
tokio-util = { version = "0.7", features = ["codec"] }
rkyv = { version = "0.7", features = ["validation"] }
regex = "1"
bytes = "1"
thiserror = "1"
url = "2"
async-trait = "0.1"
futures-core = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rand = "0.9.2"

[dev-dependencies]
wiremock = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
strip = true
